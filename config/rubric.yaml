# Complexity rubric: each dimension is scored 1-5 by an agent from the
# available evidence. The overall score is the weighted average, mapped to
# a difficulty label via the thresholds below. Weights are normalized at
# scoring time; keeping them summed to 1 reads as percentages.

dimensions:
  code_complexity:
    weight: 0.20
    description: >
      How intricate is the code that needs to change? Simple, isolated
      logic scores low; deeply nested, stateful, or algorithmically
      subtle code scores high.
  components_affected:
    weight: 0.15
    description: >
      How many distinct modules/services/layers does this touch?
      A single file scores low; cross-cutting changes score high.
  required_technical_knowledge:
    weight: 0.20
    description: >
      How much domain or framework expertise does a contributor need
      before starting? Generic skills score low; deep codebase
      internals score high.
  testing_complexity:
    weight: 0.15
    description: >
      How hard is it to verify correctness? A straightforward unit test
      scores low; integration/E2E/manual verification scores high.
  dependencies:
    weight: 0.10
    description: >
      Does this block on other issues, external libraries, or unreleased
      APIs? None scores low; hard external blockers score high.
  requirement_ambiguity:
    weight: 0.20
    description: >
      How well-specified is the ask? A precise repro/spec scores low;
      a vague, underspecified ask scores high.

thresholds:
  easy_max: 2.0
  medium_max: 3.5
